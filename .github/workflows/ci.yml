name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest (core is standard-library only)
        run: pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Bench validation (demo > naive > confident)
        if: matrix.python-version == '3.12'
        run: python notebooks/01_bench_validation.py
      - name: Threshold sweep
        if: matrix.python-version == '3.12'
        run: python notebooks/02_abstention_threshold_sweep.py
